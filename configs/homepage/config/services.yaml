- Services:
  - Media:
      - Plex:
          href: 'https://app.plex.tv/desktop/'
          description: Plex Media Server
          icon: /icons/plex.png
          siteMonitor: '{{HOMEPAGE_VAR_PLEX_URL}}'
          widget:
            type: plex
            key: '{{HOMEPAGE_VAR_PLEX_API_TOKEN}}'
            url: '{{HOMEPAGE_VAR_PLEX_URL}}'
      - PhotoPrism:
          href: '{{HOMEPAGE_VAR_PHOTOPRISM_URL}}'
          description: Image Gallery
          icon: /icons/photoprism.svg
          namespace: homelab
          app: photoprism
          podSelector: app=photoprism
          widget:
            type: photoprism
            url: 'http://photoprism.homelab.svc.cluster.local:2342'
            key: '{{HOMEPAGE_VAR_PHOTOPRISM_TOKEN}}'
      - Romm:
          href: '{{HOMEPAGE_VAR_ROMM_URL}}'
          description: Emulator and Rom Manager
          namespace: homelab
          app: romm
          podSelector: app=romm
          icon: /icons/romm.png
          widget:
            type: romm
            url: '{{HOMEPAGE_VAR_ROMM_URL}}'
            fields: ["platforms", "totalRoms", "saves"]
  - Files and Documents:
      - File Browser:
          href: '{{HOMEPAGE_VAR_FILEBROWSER_URL}}'
          description: File server and browser
          icon: /icons/fb.svg
          namespace: homelab
          app: filebrowser
          podSelector: app=filebrowser
      - qBittorrent:
          href: '{{HOMEPAGE_VAR_QBITTORRENT_URL}}'
          description: Torrent Manager
          icon: /icons/qbt.png
          namespace: homelab
          app: qbittorrent
          podSelector: app=qbittorrent
          widget:
            type: qbittorrent
            url: '{{HOMEPAGE_VAR_QBITTORRENT_URL}}'
            username: '{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}'
            password: '{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}'
      - slskd:
          href: '{{HOMEPAGE_VAR_SLSKD_URL}}'
          description: Music Sharing
          icon: /icons/slskd.png
          namespace: homelab
          app: slskd
          podSelector: app=slskd
          widget:
            type: slskd
            url: '{{HOMEPAGE_VAR_SLSKD_URL}}'
            key: '{{HOMEPAGE_VAR_SLSKD_API_KEY}}'
      - wrtag:
          href: '{{HOMEPAGE_VAR_WRTAG_URL}}'
          description: Music Tagger and Importer
          icon: /icons/musicbrainz.png
          namespace: homelab
          app: wrtag
          podSelector: app=wrtag
      - Metube:
          href: '{{HOMEPAGE_VAR_METUBE_URL}}'
          description: Youtube Downloader
          icon: /icons/metube.png
          namespace: homelab
          app: metube
          podSelector: app=metube
  - Websites:
      - Hurley's Ranch:
          href: '{{HOMEPAGE_VAR_LOST_URL}}'
          description: Lost Website
          icon: /icons/hurl.png
          namespace: homelab
          app: hurleys-ranch
          podSelector: app=hurleys-ranch
      - Pugstreet Cinema:
          href: '{{HOMEPAGE_VAR_CINEMA_URL}}'
          description: Movie Podcast
          icon: /icons/favicon.ico
          namespace: homelab
          app: pugst-cinema
          podSelector: app=pugst-cinema
- Admin:
  - ArgoCD:
      href: '{{HOMEPAGE_VAR_ARGOCD_URL}}'
      icon: /icons/argocd.png
      description: Deployment Manager
      siteMonitor: '{{HOMEPAGE_VAR_ARGOCD_URL}}'
      widget:
        type: argocd
        url: '{{HOMEPAGE_VAR_ARGOCD_URL}}'
        key: '{{HOMEPAGE_VAR_ARGOCD_TOKEN}}'
  - Grafana:
      href: '{{HOMEPAGE_VAR_GRAFANA_URL}}'
      icon: /icons/grafana.svg
      description: Observability Dashboard
      namespace: homelab
      app: grafana
      podSelector: app=grafana
      widget:
        type: grafana
        url: 'http://192.168.1.99:3001'
        username: '{{HOMEPAGE_VAR_GRAFANA_USERNAME}}'
        password: '{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}'
