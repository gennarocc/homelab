---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm
  namespace: homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: romm
  template:
    metadata:
      labels:
        app: romm
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      enableServiceLinks: false
      containers:
        - name: romm
          image: rommapp/romm:latest
          env:
            # Database Configuration
            - name: DB_HOST
              value: "romm-mariadb"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "romm"
            - name: DB_USER
              value: "romm"
            - name: DB_PASSWD
              valueFrom:
                secretKeyRef:
                  name: romm-secret
                  key: database-password
            
            # Redis Configuration
            - name: REDIS_HOST
              value: "romm-redis"
            - name: REDIS_PORT
              value: "6379"
            
            # Authentication
            - name: ROMM_AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: romm-secret
                  key: auth-secret-key
            - name: ROMM_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: romm-secret
                  key: admin-username
            - name: ROMM_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: romm-secret
                  key: admin-password
            
            # Metadata Scrapers
            - name: IGDB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: romm-secret
                  key: igdb-client-id
                  optional: true
            - name: IGDB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: romm-secret
                  key: igdb-client-secret
                  optional: true
            - name: SCREENSCRAPER_USER
              valueFrom:
                secretKeyRef:
                  name: romm-secret
                  key: screenscraper-username
                  optional: true
            - name: SCREENSCRAPER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: romm-secret
                  key: screenscraper-password
                  optional: true
            - name: RETROACHIEVEMENTS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: romm-secret
                  key: cheevos-key
                  optional: true
            - name: HLTB_API_ENABLED
              value: "true"
          
          ports:
            - containerPort: 8080
              name: http
          
          volumeMounts:
            - name: romm-library
              mountPath: /romm/library
            - name: romm-assets
              mountPath: /romm/assets
            - name: romm-resources
              mountPath: /romm/resources
            - name: homelab-configs
              mountPath: /romm/config
              subPath: romm/config
          
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      
      volumes:
        - name: romm-library
          hostPath:
            path: /hdd/games
        - name: romm-resources
          hostPath:
            path: /hdd/games/.resources
        - name: romm-assets
          hostPath:
            path: /hdd/games/saves
        - name: homelab-configs
          persistentVolumeClaim:
            claimName: homelab-configs-pvc

---
# MariaDB Database for Romm
apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm-mariadb
  namespace: homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: romm-mariadb
  template:
    metadata:
      labels:
        app: romm-mariadb
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: mariadb
          image: mariadb:10.11
          env:
            - name: MARIADB_AUTO_UPGRADE
              value: "1"
            - name: MARIADB_INITDB_SKIP_TZINFO
              value: "1"
            - name: MARIADB_DATABASE
              value: "romm"
            - name: MARIADB_USER
              value: "romm"
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: romm-secret
                  key: database-password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: romm-secret
                  key: database-password
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: database
              mountPath: /var/lib/mysql
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: database
          hostPath:
            path: /hdd/games/.database
            type: Directory

---
# Redis for Romm caching
apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm-redis
  namespace: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: romm-redis
  template:
    metadata:
      labels:
        app: romm-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"

---
# Service for Romm
apiVersion: v1
kind: Service
metadata:
  name: romm
  namespace: homelab
spec:
  selector:
    app: romm
  ports:
    - port: 8099
      targetPort: 8080
      name: http
  type: LoadBalancer

---
# Service for MariaDB
apiVersion: v1
kind: Service
metadata:
  name: romm-mariadb
  namespace: homelab
spec:
  selector:
    app: romm-mariadb
  ports:
    - port: 3306
      targetPort: 3306
  type: ClusterIP

---
# Service for Redis
apiVersion: v1
kind: Service
metadata:
  name: romm-redis
  namespace: homelab
spec:
  selector:
    app: romm-redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
