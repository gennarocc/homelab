apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  template:
    spec:
      # Add initContainer to install KSOPS and tools
      initContainers:
      - name: install-ksops
        image: viaductoss/ksops:v4.3.1
        command: ["/bin/sh", "-c"]
        args:
          - echo "Installing KSOPS and kustomize to custom tools directory" &&
            cp /usr/local/bin/ksops /custom-tools/ksops &&
            cp /usr/local/bin/kustomize /custom-tools/kustomize &&
            echo "Done installing KSOPS"
        volumeMounts:
          - mountPath: /custom-tools
            name: custom-tools
      
      # Patch the main argocd-repo-server container
      containers:
      - name: argocd-repo-server
        volumeMounts:
          # Mount the custom tools
          - mountPath: /usr/local/bin/kustomize
            name: custom-tools
            subPath: kustomize
          - mountPath: /usr/local/bin/ksops
            name: custom-tools
            subPath: ksops
          # Mount the age key
          - mountPath: /sops-age-keys
            name: sops-age-keys
            readOnly: true
        env:
          # Tell SOPS where to find the age key
          - name: SOPS_AGE_KEY_FILE
            value: /sops-age-keys/age.agekey
          # Configure XDG_CONFIG_HOME for kustomize plugins
          - name: XDG_CONFIG_HOME
            value: /.config
          - name: KUSTOMIZE_PLUGIN_HOME
            value: /.config/kustomize/plugin
      
      # Add volumes
      volumes:
      - name: custom-tools
        emptyDir: {}
      - name: sops-age-keys
        secret:
          secretName: sops-age-key
