---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: raspberry-pi
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./"
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  timeout: 5m0s
